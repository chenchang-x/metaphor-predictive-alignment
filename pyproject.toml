[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qwen3p5-9b-metaphor-predictive-alignment"
version = "1.1.0"
description = "Frozen Qwen3.5-9B MUNCH predictive-alignment experiment with matched RQ2 inputs"
requires-python = ">=3.10,<3.13"
dependencies = [
  "mpmath==1.3.0",
  "numpy==1.26.4",
]

[project.optional-dependencies]
test = ["pytest==8.3.4"]
runpod = [
  "accelerate==1.14.0",
  "huggingface-hub==1.30.0",
  "safetensors==0.8.0",
  "tokenizers==0.23.2",
  "transformers==5.16.1",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
